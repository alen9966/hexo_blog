menu:
  - name: 首页
    url: /
  - name: 项目
    url: /projects/
  - name: 关于
    url: /about

subtitle:
  typing:
    enable: true
    strings:
      - 从原理图到实测波形，记录每一次验证
      - 拆解硬件架构，也保留踩坑与修正
      - 愿好奇心与电路一起保持通电
    typeSpeed: 55
    backSpeed: 40
    backDelay: 2200
    startDelay: 200
    loop: true
    shuffle: false
    showCursor: true
    cursorChar: "_"
    smartBackspace: false

sidebar:
  position: right
  menu: true
  article:
    show_common: true

social:
  github: https://github.com/alen9966

banner: /images/myimge/wallhaven-3ze1v3.jpg
cover: false

widgets:
  - recent_posts
  - category
  - archive

recent_posts_limits: 6
show_update_time: true

home_categories:
  enable: false
  content: []

summary:
  enable: true
  style: subtitle

footer:
  since: 2026
  powered: false
  count: false
  busuanzi: false

custom_font:
  enable: false
  article: []

font:
  enable: false

reimu_cursor:
  enable: false

dark_mode:
  enable: false

generator_search:
  enable: true
  field: post
  content: true

firework:
  enable: false
  disable_on_mobile: false

pace:
  enable: false

preloader:
  enable: false
  text:
    zh-CN: 页面整理中...
    en: Loading...

animation:
  enable: false
  options:
    header:
      title: slide-up
      subTitle: slide-down
    home:
      post: fade-up
      widget: fade-up
      sidebar: fade-up
    article:
      whole: fade-up
      date: zoom-in
      category: zoom-in
      tag: zoom-in
      comment: zoom-in
      reading: zoom-in
      nav: fade-up

internal_theme:
  light:
    --red-0: "#f06c8d"
    --red-1: "#f589a2"
    --red-2: "#f8a8b9"
    --red-3: "#fbc9d4"
    --red-4: "#fde5eb"
    --red-5: "#fff2f6"
    --red-5-5: "#fff7fa"
    --red-6: "#fffbfd"
    --color-red-6-shadow: "rgba(240, 108, 141, 0.42)"
    --color-red-3-shadow: "rgba(240, 108, 141, 0.18)"
  dark:
    --red-4: "rgba(251, 201, 212, 0.36)"
    --red-5: "rgba(255, 242, 246, 0.12)"
    --red-5-5: "rgba(255, 247, 250, 0.08)"
    --red-6: "rgba(255, 251, 253, 0.16)"

injector:
  head_end:
    - <link rel="stylesheet" href="/css/site-home.css">
  body_end:
    - <script src="/js/lazyload-fallback.js"></script>

vendor:
  js:
    lazysizes:
      src: /js/vendor/lazysizes.min.js
      integrity:
    clipboard:
      src: /js/vendor/clipboard.min.js
      integrity:
    typed:
      src: /js/vendor/typed.umd.js
      integrity:
    mathjax:
      src: https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js
      integrity:

math:
  enable: true
  katex:
    enable: false
    autoRender: false
  mathjax:
    enable: true
