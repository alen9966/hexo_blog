<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">史密斯圆图中串联和并联电抗的移动方向</title>
  <desc id="desc">简化史密斯圆图标出容性区域、感性区域和串并联电感电容的移动方向</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9fb"/><stop offset="1" stop-color="#f0f7ff"/></linearGradient>
    <marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f06c8d"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5f91dd"/></marker>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <text x="600" y="56" text-anchor="middle" fill="#203957" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="33" font-weight="700">史密斯圆图：模长接近 50 Ω，不代表点已经落在圆心</text>
  <g transform="translate(90 95)">
    <circle cx="320" cy="300" r="270" fill="#fff" fill-opacity="0.88" stroke="#455f82" stroke-width="4"/>
    <path d="M50 300H590" stroke="#8ea1b8" stroke-width="2"/>
    <circle cx="455" cy="300" r="135" fill="none" stroke="#c0ccda" stroke-width="2"/>
    <circle cx="500" cy="300" r="90" fill="none" stroke="#c0ccda" stroke-width="2"/>
    <circle cx="545" cy="300" r="45" fill="none" stroke="#c0ccda" stroke-width="2"/>
    <path d="M50 300C160 30 455 30 590 300" fill="none" stroke="#b7c5d5" stroke-width="2"/>
    <path d="M50 300C160 570 455 570 590 300" fill="none" stroke="#b7c5d5" stroke-width="2"/>
    <path d="M185 300C250 165 470 165 590 300" fill="none" stroke="#d1d9e4" stroke-width="2"/>
    <path d="M185 300C250 435 470 435 590 300" fill="none" stroke="#d1d9e4" stroke-width="2"/>
    <circle cx="320" cy="300" r="10" fill="#42b99f"/>
    <text x="320" y="334" text-anchor="middle" fill="#358879" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">50 + j0 Ω</text>
    <circle cx="250" cy="442" r="11" fill="#f06c8d"/>
    <text x="250" y="477" text-anchor="middle" fill="#b74f6a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">33 − j40 Ω</text>
    <text x="320" y="78" text-anchor="middle" fill="#687d96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22">上半圆：感性（+jX）</text>
    <text x="320" y="548" text-anchor="middle" fill="#687d96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22">下半圆：容性（−jX）</text>
    <path d="M250 442C190 350 200 238 285 176" fill="none" stroke="#f06c8d" stroke-width="5" marker-end="url(#pink)"/>
    <path d="M285 176C205 240 195 360 250 442" fill="none" stroke="#5f91dd" stroke-width="5" marker-end="url(#blue)" stroke-dasharray="9 8"/>
  </g>
  <g transform="translate(735 135)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="390" height="480" rx="26" fill="#fff" fill-opacity="0.9" stroke="#d4deea" stroke-width="3"/>
    <text x="195" y="55" text-anchor="middle" fill="#2b4565" font-size="27" font-weight="700">元件怎样移动工作点</text>
    <g font-size="22">
      <circle cx="50" cy="112" r="15" fill="#f06c8d"/><text x="82" y="120" fill="#405a79">串联电感：顺时针</text>
      <circle cx="50" cy="175" r="15" fill="#5f91dd"/><text x="82" y="183" fill="#405a79">串联电容：逆时针</text>
      <circle cx="50" cy="258" r="15" fill="#a77dd4"/><text x="82" y="266" fill="#405a79">并联电感：逆时针</text>
      <circle cx="50" cy="321" r="15" fill="#55b99f"/><text x="82" y="329" fill="#405a79">并联电容：顺时针</text>
    </g>
    <path d="M42 378H348" stroke="#d5deea" stroke-width="2"/>
    <text x="30" y="418" fill="#6a7e96" font-size="19">串联元件沿等电阻圆移动；</text>
    <text x="30" y="450" fill="#6a7e96" font-size="19">并联元件在导纳圆上沿等电导圆移动。</text>
  </g>
  <text x="600" y="720" text-anchor="middle" fill="#72849b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">示意图只用于理解方向；实际匹配值应由目标频率处的复阻抗和器件寄生参数计算。</text>
</svg>
