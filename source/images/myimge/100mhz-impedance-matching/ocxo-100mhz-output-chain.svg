<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">100 MHz恒温晶振的控制、功分、整形和SMA输出链路</title>
  <desc id="desc">FPGA通过DAC调节OCXO，100 MHz正弦波经交流耦合和变压器式功分器分为数字整形与滤波输出两路</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#fff5f9"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#405879" flood-opacity="0.13"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607b9e"/></marker>
  </defs>
  <rect width="1400" height="650" rx="28" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" fill="#203957" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">100 MHz 参考时钟：控制环与输出链路</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle" filter="url(#s)">
    <rect x="75" y="120" width="180" height="92" rx="20" fill="#fff" stroke="#a692e5" stroke-width="3"/>
    <rect x="330" y="120" width="180" height="92" rx="20" fill="#fff" stroke="#f1b465" stroke-width="3"/>
    <rect x="585" y="120" width="220" height="130" rx="22" fill="#fff" stroke="#f19ab0" stroke-width="3"/>
    <rect x="885" y="138" width="170" height="94" rx="20" fill="#fff" stroke="#78aee9" stroke-width="3"/>
    <rect x="1135" y="120" width="190" height="130" rx="22" fill="#fff" stroke="#74c9bb" stroke-width="3"/>
    <rect x="845" y="358" width="210" height="100" rx="20" fill="#fff" stroke="#a692e5" stroke-width="3"/>
    <rect x="1115" y="358" width="210" height="100" rx="20" fill="#fff" stroke="#f1b465" stroke-width="3"/>
    <rect x="1115" y="510" width="210" height="88" rx="20" fill="#fff" stroke="#f06c8d" stroke-width="3"/>
  </g>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="165" y="158" fill="#294361" font-size="24" font-weight="700">FPGA</text><text x="165" y="188" fill="#6c7f96" font-size="18">计算控制码</text>
    <text x="420" y="158" fill="#294361" font-size="24" font-weight="700">16 bit DAC</text><text x="420" y="188" fill="#6c7f96" font-size="18">输出调谐电压</text>
    <text x="695" y="167" fill="#294361" font-size="26" font-weight="700">100 MHz OCXO</text><text x="695" y="205" fill="#6c7f96" font-size="19">EFC / VCO 控制端</text>
    <text x="970" y="178" fill="#294361" font-size="23" font-weight="700">交流耦合</text><text x="970" y="207" fill="#6c7f96" font-size="17">隔离直流偏置</text>
    <text x="1230" y="160" fill="#294361" font-size="24" font-weight="700">变压器式功分</text><text x="1230" y="194" fill="#6c7f96" font-size="18">分成两路</text><text x="1230" y="220" fill="#6c7f96" font-size="18">保持端口条件</text>
    <text x="950" y="398" fill="#294361" font-size="23" font-weight="700">迟滞比较器</text><text x="950" y="430" fill="#6c7f96" font-size="18">正弦波 → 数字边沿</text>
    <text x="1220" y="398" fill="#294361" font-size="23" font-weight="700">耦合 → 滤波 → 耦合</text><text x="1220" y="430" fill="#6c7f96" font-size="18">保留 100 MHz 基波</text>
    <text x="1220" y="548" fill="#294361" font-size="23" font-weight="700">SMA 输出</text><text x="1220" y="577" fill="#6c7f96" font-size="18">示波器 / 频谱测试</text>
  </g>
  <g fill="none" stroke="#607b9e" stroke-width="4" marker-end="url(#a)">
    <path d="M255 166H330"/><path d="M510 166H585"/>
    <path d="M805 185H885"/><path d="M1055 185H1135"/>
    <path d="M1230 250V300H950V358"/>
    <path d="M845 408H700V250" stroke-dasharray="10 8"/>
    <path d="M1230 250V358"/><path d="M1220 458V510"/>
  </g>
  <text x="700" y="625" text-anchor="middle" fill="#71849b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19">上支路用于形成 FPGA 可采样的时钟边沿；下支路保留正弦参考，经滤波后从 SMA 输出。</text>
</svg>
