<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650">
  <defs>
    <style>
      .t{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243047}.title{font-size:30px;font-weight:700}.mid{font-size:22px;font-weight:600}.small{font-size:19px}
      .box{fill:#fff;stroke:#8090ad;stroke-width:2}.dut{fill:#fff1f6;stroke:#d95c8c;stroke-width:2}.ref{fill:#eef4ff;stroke:#6687cc;stroke-width:2}
      .line{stroke:#4f607c;stroke-width:3;fill:none}.dash{stroke:#8290aa;stroke-width:2;stroke-dasharray:8 7;fill:none}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#4f607c"/></marker>
  </defs>
  <rect width="1180" height="650" rx="28" fill="#f8faff"/>
  <text x="590" y="48" text-anchor="middle" class="t title">双参考源互相关测量的信号关系</text>
  <rect x="55" y="255" width="190" height="105" rx="18" class="dut"/>
  <text x="150" y="296" text-anchor="middle" class="t mid">100 MHz OCXO</text>
  <text x="150" y="329" text-anchor="middle" class="t small">共同的 DUT 相位 φD</text>
  <path d="M245 308 H330 V180 H430" class="line" marker-end="url(#a)"/>
  <path d="M330 308 V435 H430" class="line" marker-end="url(#a)"/>
  <rect x="430" y="125" width="225" height="110" rx="18" class="box"/>
  <text x="542" y="166" text-anchor="middle" class="t mid">I/Q 测相通道 1</text>
  <text x="542" y="200" text-anchor="middle" class="t small">x₁ = φD − φR1 + n₁</text>
  <rect x="430" y="380" width="225" height="110" rx="18" class="box"/>
  <text x="542" y="421" text-anchor="middle" class="t mid">I/Q 测相通道 2</text>
  <text x="542" y="455" text-anchor="middle" class="t small">x₂ = φD − φR2 + n₂</text>
  <rect x="735" y="82" width="210" height="90" rx="18" class="ref"/>
  <text x="840" y="118" text-anchor="middle" class="t mid">外接参考源 1</text>
  <text x="840" y="147" text-anchor="middle" class="t small">φR1</text>
  <path d="M735 127 H690 V180 H655" class="line" marker-end="url(#a)"/>
  <rect x="735" y="493" width="210" height="90" rx="18" class="ref"/>
  <text x="840" y="529" text-anchor="middle" class="t mid">外接参考源 2</text>
  <text x="840" y="558" text-anchor="middle" class="t small">φR2</text>
  <path d="M735 538 H690 V435 H655" class="line" marker-end="url(#a)"/>
  <path d="M655 180 H770 V307 H820" class="line" marker-end="url(#a)"/>
  <path d="M655 435 H770 V342 H820" class="line" marker-end="url(#a)"/>
  <rect x="820" y="265" width="290" height="120" rx="20" class="dut"/>
  <text x="965" y="305" text-anchor="middle" class="t mid">FFT 与互功率谱平均</text>
  <text x="965" y="338" text-anchor="middle" class="t small">保留两路相关的 DUT 噪声</text>
  <text x="965" y="368" text-anchor="middle" class="t small">逐步压低不相关的参考源/通道噪声</text>
  <path d="M735 192 C945 205 1050 170 1085 92" class="dash"/>
  <path d="M735 472 C945 456 1050 493 1085 568" class="dash"/>
  <text x="1010" y="116" text-anchor="middle" class="t small">参考源必须尽量独立</text>
  <text x="1010" y="596" text-anchor="middle" class="t small">共电源、串扰会留下相关噪声</text>
  <text x="590" y="625" text-anchor="middle" class="t small">互相关不能消除 DUT 输出链路中共同经过的功分器、滤波器或 LNA 的附加相噪</text>
</svg>
