<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8fb"/>
      <stop offset="1" stop-color="#f3f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#9a7890" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#59657a"/>
    </marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei',sans-serif;fill:#383b46}
      .label{font:600 25px 'Microsoft YaHei',sans-serif;fill:#343846}
      .note{font:400 21px 'Microsoft YaHei',sans-serif;fill:#697083}
      .box{fill:#fff;stroke:#dd9fbe;stroke-width:3;rx:20;filter:url(#shadow)}
      .box2{fill:#fff;stroke:#8eb6dd;stroke-width:3;rx:20;filter:url(#shadow)}
      .line{stroke:#59657a;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .branch{stroke:#59657a;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1500" height="620" fill="url(#bg)" rx="28"/>
  <text x="750" y="62" text-anchor="middle" class="title">100 MHz OCXO 输出链路</text>

  <rect x="70" y="225" width="145" height="86" class="box"/>
  <text x="142" y="278" text-anchor="middle" class="label">FPGA</text>
  <rect x="265" y="225" width="145" height="86" class="box"/>
  <text x="338" y="278" text-anchor="middle" class="label">DAC</text>
  <rect x="460" y="225" width="170" height="86" class="box"/>
  <text x="545" y="278" text-anchor="middle" class="label">OCXO</text>
  <rect x="695" y="225" width="170" height="86" class="box"/>
  <text x="780" y="278" text-anchor="middle" class="label">功分器</text>

  <path d="M215 268H265" class="line"/>
  <path d="M410 268H460" class="line"/>
  <path d="M630 268H695" class="line"/>
  <text x="337" y="205" text-anchor="middle" class="note">VCO 调谐电压</text>

  <path d="M865 268H915V145H980" class="branch"/>
  <path d="M970 145H980" class="line"/>
  <rect x="980" y="100" width="175" height="86" class="box2"/>
  <text x="1068" y="153" text-anchor="middle" class="label">比较器</text>
  <path d="M1155 143H1300V225" class="line"/>
  <rect x="1300" y="225" width="130" height="86" class="box2"/>
  <text x="1365" y="278" text-anchor="middle" class="label">FPGA</text>
  <text x="1195" y="112" text-anchor="middle" class="note">数字时钟反馈</text>

  <path d="M865 268H915V409H955" class="branch"/>
  <path d="M945 409H955" class="line"/>
  <rect x="955" y="365" width="155" height="86" class="box2"/>
  <text x="1033" y="418" text-anchor="middle" class="label">耦合电容</text>
  <path d="M1110 408H1150" class="line"/>
  <rect x="1150" y="365" width="120" height="86" class="box2"/>
  <text x="1210" y="418" text-anchor="middle" class="label">滤波器</text>
  <path d="M1270 408H1310" class="line"/>
  <rect x="1310" y="365" width="140" height="86" class="box2"/>
  <text x="1380" y="400" text-anchor="middle" class="label">耦合</text>
  <text x="1380" y="432" text-anchor="middle" class="label">电容</text>
  <path d="M1450 408H1475" class="line"/>
  <text x="1443" y="491" text-anchor="middle" class="note">SMA 输出</text>

  <text x="750" y="560" text-anchor="middle" class="note">VNA 断电测量时，激励从 SMA 端反向进入下方支路；双负载法则在整板正常工作时测量输出幅值</text>
</svg>
