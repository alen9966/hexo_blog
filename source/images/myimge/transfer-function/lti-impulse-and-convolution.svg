<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <style>.h{font:700 28px 'Microsoft YaHei',sans-serif;fill:#1f2937}.t{font:19px 'Microsoft YaHei',sans-serif;fill:#374151}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#4b5563}.b{fill:#fff;stroke:#91a4c0;stroke-width:2}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.w{stroke:#2563eb;stroke-width:3;fill:none}.g{stroke:#12a878;stroke-width:3;fill:none}</style>
  <rect width="1200" height="540" fill="#fbfcff"/>
  <text x="600" y="46" text-anchor="middle" class="h">卷积的物理理解：拆分输入、分别响应、最后叠加</text>
  <rect x="50" y="105" width="320" height="340" rx="18" class="b"/><text x="210" y="145" text-anchor="middle" class="h">1. 把输入拆开</text>
  <path d="M85 270 C115 230 135 310 165 245 S220 315 250 230 S305 280 335 250" class="w"/><text x="210" y="335" text-anchor="middle" class="t">u(t) 可以看成许多</text><text x="210" y="365" text-anchor="middle" class="t">移位小冲激的叠加</text>
  <rect x="440" y="105" width="320" height="340" rx="18" class="b"/><text x="600" y="145" text-anchor="middle" class="h">2. 分别通过系统</text>
  <path d="M490 255 L715 255" class="a"/><rect x="545" y="215" width="115" height="80" rx="9" fill="#eaf1ff" stroke="#2563eb" stroke-width="2"/><text x="602" y="263" text-anchor="middle" class="t">LTI 系统</text><text x="600" y="340" text-anchor="middle" class="t">每个冲激产生一份</text><text x="600" y="370" text-anchor="middle" class="t">移位冲激响应 h(t-τ)</text>
  <rect x="830" y="105" width="320" height="340" rx="18" class="b"/><text x="990" y="145" text-anchor="middle" class="h">3. 把响应相加</text>
  <path d="M865 285 C900 250 920 318 950 265 S1000 310 1030 245 S1080 292 1120 260" class="g"/><text x="990" y="335" text-anchor="middle" class="t">得到完整输出 x(t)</text><text x="990" y="380" text-anchor="middle" class="h">x(t)=u(t)*h(t)</text>
  <path d="M372 275 L430 275" class="a"/><path d="M762 275 L820 275" class="a"/>
  <text x="600" y="500" text-anchor="middle" class="s">连续时间下的“相加”表现为积分，因此得到卷积积分。</text>
</svg>
