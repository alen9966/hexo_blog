name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npx hexo clean
          npx hexo generate

      - name: Publish to alen9966.github.io
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd public
          git init
          git checkout -B main
          git add -A
          git commit -m "Site updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          if [ -n "${DEPLOY_SSH_KEY:-}" ]; then
            echo "Deploying via SSH deploy key..."
            install -m 700 -d ~/.ssh
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
            git remote add origin "git@github.com:alen9966/alen9966.github.io.git"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
              git push --force origin HEAD:main
            exit 0
          fi

          if [ -n "${DEPLOY_TOKEN:-}" ]; then
            echo "Deploying via DEPLOY_TOKEN..."
            git push --force "https://x-access-token:${DEPLOY_TOKEN}@github.com/alen9966/alen9966.github.io.git" HEAD:main
            exit 0
          fi

          echo "Missing deploy credentials."
          echo "Run scripts/setup-auto-deploy.ps1 on your machine once,"
          echo "or add DEPLOY_SSH_KEY / DEPLOY_TOKEN secret on hexo_blog."
          exit 1
